<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Innovish Content Maker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 1200px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 2em;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
            font-size: 14px;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
            font-family: inherit;
        }

        input[type="text"]:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        .file-upload-wrapper {
            position: relative;
            display: inline-block;
            width: 100%;
        }

        .file-upload-button {
            display: inline-block;
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
            font-weight: 600;
            text-align: center;
            border: none;
            width: 100%;
        }

        .file-upload-button:hover {
            background: #5568d3;
        }

        input[type="file"] {
            position: absolute;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        .file-name {
            margin-top: 8px;
            color: #666;
            font-size: 13px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .test-api-button {
            padding: 10px 20px;
            background: linear-gradient(135deg, #4299e1 0%, #3182ce 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 2px 8px rgba(66, 153, 225, 0.3);
        }

        .test-api-button:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(66, 153, 225, 0.4);
        }

        .test-api-button:active {
            transform: translateY(0);
        }

        .test-api-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .test-api-result {
            margin-top: 10px;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            display: none;
        }

        .test-api-result.show {
            display: block;
        }

        .test-api-result.success {
            background: #c6f6d5;
            color: #22543d;
            border: 1px solid #9ae6b4;
        }

        .test-api-result.error {
            background: #fed7d7;
            color: #742a2a;
            border: 1px solid #fc8181;
        }

        .test-api-result.info {
            background: #bee3f8;
            color: #2c5282;
            border: 1px solid #90cdf4;
        }

        .generate-button-container {
            display: flex;
            justify-content: flex-end;
            margin-top: 30px;
        }

        .generate-button {
            padding: 14px 32px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .generate-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .generate-button:active {
            transform: translateY(0);
        }

        .chapter-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            flex: 1;
        }

        .chapter-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .generate-chapter-button {
            padding: 8px 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
            white-space: nowrap;
        }

        .generate-chapter-button:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .generate-chapter-button:active {
            transform: translateY(0);
        }

        .generate-chapter-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .generate-paragraphs-button {
            padding: 8px 16px;
            background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 2px 8px rgba(72, 187, 120, 0.3);
            white-space: nowrap;
        }

        .generate-paragraphs-button:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(72, 187, 120, 0.4);
        }

        .generate-paragraphs-button:active {
            transform: translateY(0);
        }

        .generate-paragraphs-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .play-audio-button {
            padding: 8px 16px;
            background: linear-gradient(135deg, #f6ad55 0%, #ed8936 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 2px 8px rgba(246, 173, 85, 0.3);
            white-space: nowrap;
            display: none;
        }

        .play-audio-button.show {
            display: inline-block;
        }

        .play-audio-button:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(246, 173, 85, 0.4);
        }

        .play-audio-button:active {
            transform: translateY(0);
        }

        .concatenate-button {
            padding: 8px 16px;
            background: linear-gradient(135deg, #9f7aea 0%, #805ad5 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 2px 8px rgba(159, 122, 234, 0.3);
            white-space: nowrap;
        }

        .concatenate-button:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(159, 122, 234, 0.4);
        }

        .concatenate-button:active {
            transform: translateY(0);
        }

        .concatenate-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .concatenate-button.normalized {
            border: 3px solid #48bb78;
            box-shadow: 0 2px 8px rgba(159, 122, 234, 0.3), 0 0 0 2px rgba(72, 187, 120, 0.3);
        }

        .concatenate-button.not-normalized {
            border: 3px solid #ecc94b;
            box-shadow: 0 2px 8px rgba(159, 122, 234, 0.3), 0 0 0 2px rgba(236, 201, 75, 0.3);
        }

        .progress-container {
            margin-top: 10px;
            padding: 10px;
            background: #f0f0f0;
            border-radius: 6px;
            display: none;
        }

        .progress-container.show {
            display: block;
        }

        .progress-bar {
            width: 100%;
            height: 20px;
            background: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 5px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s;
            border-radius: 10px;
        }

        .progress-text {
            font-size: 12px;
            color: #666;
            text-align: center;
        }

        .status-message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
        }

        .status-message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .status-message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .status-message.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
            display: block;
        }

        .chapters-container {
            margin-top: 30px;
            display: none;
        }

        .chapters-container.show {
            display: block;
        }

        .chapters-header {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .generate-all-chapters-button {
            padding: 8px 16px;
            background: linear-gradient(135deg, #ed8936 0%, #dd6b20 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 2px 8px rgba(237, 137, 54, 0.3);
            white-space: nowrap;
        }

        .generate-all-chapters-button:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(237, 137, 54, 0.4);
        }

        .generate-all-chapters-button:active {
            transform: translateY(0);
        }

        .generate-all-chapters-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .chapter-item {
            margin-bottom: 15px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            background: white;
            overflow: hidden;
        }

        .chapter-header {
            padding: 15px;
            background: #f9f9f9;
            transition: background 0.3s;
            user-select: none;
        }

        .chapter-header-top {
            display: flex;
            align-items: center;
            cursor: pointer;
            gap: 12px;
        }

        .chapter-header:hover {
            background: #f0f0f0;
        }

        .chapter-toggle {
            font-size: 20px;
            font-weight: bold;
            color: #667eea;
            margin-right: 12px;
            width: 24px;
            text-align: center;
            flex-shrink: 0;
        }

        .chapter-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            flex: 1;
        }

        .chapter-title-content {
            width: 100%;
            padding: 8px 12px;
            border: 2px solid #667eea;
            border-radius: 8px;
            font-size: 14px;
            background: #f0f7ff;
            font-family: inherit;
            min-height: 60px;
            resize: vertical;
        }

        .chapter-title-actions {
            margin-top: 8px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .chapter-title-prompt {
            width: 100%;
            padding: 8px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 13px;
            font-family: inherit;
        }

        .chapter-title-buttons {
            display: flex;
            gap: 10px;
        }

        .chapter-actions-row {
            margin-top: 10px;
            padding-left: 36px;
        }

        .chapter-paragraphs {
            display: none;
            padding: 15px;
            border-top: 1px solid #e0e0e0;
        }

        .chapter-paragraphs.expanded {
            display: block;
        }

        .paragraph-item {
            margin-bottom: 15px;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            background: #fafafa;
            display: flex;
            flex-direction: row;
            gap: 12px;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .paragraph-number {
            flex-shrink: 0;
            width: 40px;
            font-size: 16px;
            font-weight: 600;
            color: #667eea;
            display: flex;
            align-items: flex-start;
            padding-top: 12px;
            text-align: center;
            justify-content: center;
        }

        .paragraph-content-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .paragraph-item:hover {
            border-color: #667eea;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.1);
        }

        .paragraph-item:last-child {
            margin-bottom: 0;
        }

        .paragraph-content {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
            font-family: inherit;
            min-height: 100px;
            resize: vertical;
        }

        .paragraph-content:focus {
            outline: none;
            border-color: #667eea;
        }

        .paragraph-prompt {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #d0d0d0;
            border-radius: 6px;
            font-size: 13px;
            transition: border-color 0.3s;
            font-family: inherit;
        }

        .paragraph-prompt:focus {
            outline: none;
            border-color: #667eea;
        }

        .paragraph-prompt::placeholder {
            color: #999;
            font-style: italic;
        }

        .paragraph-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            align-items: center;
        }

        .play-paragraph-button,
        .generate-paragraph-button {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            white-space: nowrap;
        }

        .play-paragraph-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
        }

        .play-paragraph-button:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .generate-paragraph-button {
            background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
            color: white;
            box-shadow: 0 2px 8px rgba(72, 187, 120, 0.3);
        }

        .generate-paragraph-button:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(72, 187, 120, 0.4);
        }

        .play-paragraph-button:disabled,
        .generate-paragraph-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .play-paragraph-button:active,
        .generate-paragraph-button:active {
            transform: translateY(0);
        }

        .play-paragraph-button.hidden,
        .generate-paragraph-button.hidden {
            display: none;
        }

        /* Tab System */
        .tabs-container {
            margin-bottom: 30px;
        }

        .tabs {
            display: flex;
            border-bottom: 2px solid #e0e0e0;
            margin-bottom: 20px;
        }

        .tab-button {
            flex: 1;
            padding: 12px 24px;
            background: transparent;
            border: none;
            border-bottom: 3px solid transparent;
            font-size: 16px;
            font-weight: 600;
            color: #666;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }

        .tab-button:hover {
            color: #667eea;
            background: #f5f5f5;
        }

        .tab-button.active {
            color: #667eea;
            border-bottom-color: #667eea;
            background: #fafafa;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Comic Maker specific styles */
        .comic-chapter-item {
            margin-bottom: 20px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            background: #fafafa;
        }

        .comic-chapter-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }

        .comic-chapter-content {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            min-height: 200px;
            resize: vertical;
            background: white;
            line-height: 1.6;
        }

        .comic-chapters-container {
            margin-top: 20px;
        }

        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="tabs-container">
            <div class="tabs">
                <button class="tab-button" data-tab="content-writer">✍️ Content Writer</button>
                <button class="tab-button active" data-tab="tts-generator">🎤 TTS Generator</button>
                <button class="tab-button" data-tab="comic-maker">📚 Comic Maker</button>
            </div>
        </div>

        <!-- Content Writer Tab -->
        <div id="content-writer-tab" class="tab-content">
            <h1>✍️ Content Writer</h1>
            
            <form id="contentWriterForm" enctype="multipart/form-data">
                <div class="form-group">
                    <label for="content_writer_text_file">Upload Done Part File</label>
                    <div class="file-upload-wrapper">
                        <button type="button" class="file-upload-button" onclick="document.getElementById('content_writer_text_file').click()">
                            Choose File
                        </button>
                        <input type="file" id="content_writer_text_file" name="content_writer_text_file" accept=".txt,.text,.docx" />
                        <div class="file-name" id="content-writer-file-name">No file chosen</div>
                    </div>
                </div>

                <div class="form-group" id="contentWriterChaptersListGroup" style="display: none;">
                    <label>Chapters</label>
                    <div id="contentWriterChaptersList" style="max-height: 150px; overflow-y: auto; border: 2px solid #e0e0e0; border-radius: 8px; padding: 10px; background: #fafafa; display: flex; flex-wrap: wrap; gap: 8px;">
                        <!-- Chapter list will be populated here -->
                    </div>
                </div>

                <div class="form-group" id="contentWriterChapterReadGroup" style="display: none;">
                    <label>Chapter Content</label>
                    <textarea id="contentWriterChapterRead" readonly style="width: 100%; padding: 15px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 14px; font-family: inherit; min-height: 400px; resize: vertical; background: #fafafa; line-height: 1.6;"></textarea>
                </div>

                <div class="form-group">
                    <label for="content_writer_prompt_file">Upload Prompt File</label>
                    <div class="file-upload-wrapper">
                        <button type="button" class="file-upload-button" onclick="document.getElementById('content_writer_prompt_file').click()">
                            Choose File
                        </button>
                        <input type="file" id="content_writer_prompt_file" name="content_writer_prompt_file" accept=".txt,.text,.docx" />
                        <div class="file-name" id="content-writer-prompt-file-name">No file chosen</div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="content_writer_prompt">Prompt</label>
                    <textarea id="content_writer_prompt" name="content_writer_prompt" placeholder="Enter your prompt here..." rows="4"></textarea>
                </div>

                <div class="form-group">
                    <label for="content_writer_plot_file">Upload Plot File</label>
                    <div class="file-upload-wrapper">
                        <button type="button" class="file-upload-button" onclick="document.getElementById('content_writer_plot_file').click()">
                            Choose File
                        </button>
                        <input type="file" id="content_writer_plot_file" name="content_writer_plot_file" accept=".txt,.text,.docx" />
                        <div class="file-name" id="content-writer-plot-file-name">No file chosen</div>
                    </div>
                </div>

                <div class="form-group">
                    <label>To-be Plot Text Window</label>
                    <textarea id="contentWriterPlotText" readonly style="width: 100%; padding: 15px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 14px; font-family: inherit; min-height: 200px; resize: vertical; background: #fafafa; line-height: 1.6;"></textarea>
                </div>

                <div class="form-group">
                    <button type="button" id="generateNextChapterButton" class="generate-button" style="width: 100%;">Generate Next Chapter</button>
                </div>

                <div class="form-group">
                    <label for="content_writer_generate_chapter_prompt">Generate Chapter Prompt</label>
                    <textarea id="content_writer_generate_chapter_prompt" name="content_writer_generate_chapter_prompt" placeholder="Enter prompt for generating the next chapter..." rows="2" style="width: 100%; padding: 10px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 14px; font-family: inherit;"></textarea>
                </div>

                <div class="form-group">
                    <label>Next Chapter Generation</label>
                    <textarea id="contentWriterNextChapter" readonly style="width: 100%; padding: 15px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 14px; font-family: inherit; min-height: 400px; resize: vertical; background: #fafafa; line-height: 1.6;"></textarea>
                </div>

                <div class="form-group">
                    <button type="button" id="saveAllChaptersButton" class="generate-button" style="width: 100%; background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);">Save All Chapters</button>
                </div>

            </form>
        </div>

        <!-- TTS Generator Tab -->
        <div id="tts-generator-tab" class="tab-content active">
            <h1>🎤 TTS Generator</h1>
        
        <div style="margin-bottom: 20px; text-align: center;">
            <button type="button" id="testApiButton" class="test-api-button">🔍 Test API</button>
            <div id="testApiResult" class="test-api-result"></div>
        </div>
        
        <form id="ttsForm" enctype="multipart/form-data">
            <div class="form-group">
                <label for="text_file">Upload Text File</label>
                <div class="file-upload-wrapper">
                    <button type="button" class="file-upload-button" onclick="document.getElementById('text_file').click()">
                        Choose File
                    </button>
                    <input type="file" id="text_file" name="text_file" accept=".txt,.text" />

            <div class="form-group" id="ttsChaptersListGroup" style="display: none;">

            <div class="form-group" id="ttsChapterContentGroup" style="display: none;">

                    <!-- Chapter paragraphs and buttons will be displayed here -->

            <div class="status-message" id="statusMessage"></div>

        <!-- Comic Maker Tab -->
        <div id="comic-maker-tab" class="tab-content">
            <h1>📚 Comic Maker</h1>
            
            <form id="comicForm" enctype="multipart/form-data">
                <div class="form-group">
                    <label for="comic_text_file">Upload Text File</label>
                    <div class="file-upload-wrapper">

                            Choose File
                        </button>
                        <input type="file" id="comic_text_file" name="comic_text_file" accept=".txt,.text" />
                        <div class="file-name" id="comic-file-name">No file chosen</div>
                    </div>
                </div>

                <div class="comic-chapters-container" id="comicChaptersContainer">

                    <div id="comicChaptersList"></div>

    </div>

    <script>
        // Tab switching functionality
        const tabButtons = document.querySelectorAll('.tab-button');
        const tabContents = document.querySelectorAll('.tab-content');
        
        tabButtons.forEach(button => {
            button.addEventListener('click', function() {
                const targetTab = this.getAttribute('data-tab');
                
                // Remove active class from all tabs and buttons
                tabButtons.forEach(btn => btn.classList.remove('active'));
                tabContents.forEach(content => content.classList.remove('active'));
                
                // Add active class to clicked button and corresponding content
                this.classList.add('active');
                document.getElementById(`${targetTab}-tab`).classList.add('active');
            });
        });

        const form = document.getElementById('ttsForm');
        const fileInput = document.getElementById('text_file');
        const fileNameDisplay = document.getElementById('file-name');
        const statusMessage = document.getElementById('statusMessage');
        const generateButton = document.getElementById('generateButton');
        const promptInput = document.getElementById('prompt');
        const voice1Input = document.getElementById('voice1');
        const voice2Input = document.getElementById('voice2');
        
        // Comic Maker elements
        const comicForm = document.getElementById('comicForm');
        const comicFileInput = document.getElementById('comic_text_file');
        const comicFileNameDisplay = document.getElementById('comic-file-name');
        const comicChaptersList = document.getElementById('comicChaptersList');
        const comicChaptersHeader = document.getElementById('comicChaptersHeader');
        
        // Content Writer elements
        const contentWriterForm = document.getElementById('contentWriterForm');
        const contentWriterFileInput = document.getElementById('content_writer_text_file');
        const contentWriterFileNameDisplay = document.getElementById('content-writer-file-name');
        const contentWriterChaptersList = document.getElementById('contentWriterChaptersList');
        const contentWriterChaptersListGroup = document.getElementById('contentWriterChaptersListGroup');
        const contentWriterChapterRead = document.getElementById('contentWriterChapterRead');
        const contentWriterChapterReadGroup = document.getElementById('contentWriterChapterReadGroup');
        const contentWriterPromptInput = document.getElementById('content_writer_prompt');
        const contentWriterPromptFileInput = document.getElementById('content_writer_prompt_file');
        const contentWriterPromptFileNameDisplay = document.getElementById('content-writer-prompt-file-name');
        const contentWriterPlotFileInput = document.getElementById('content_writer_plot_file');
        const contentWriterPlotFileNameDisplay = document.getElementById('content-writer-plot-file-name');
        const contentWriterPlotText = document.getElementById('contentWriterPlotText');
        const generateNextChapterButton = document.getElementById('generateNextChapterButton');
        const contentWriterGenerateChapterPrompt = document.getElementById('content_writer_generate_chapter_prompt');
        const contentWriterNextChapter = document.getElementById('contentWriterNextChapter');
        const saveAllChaptersButton = document.getElementById('saveAllChaptersButton');
        
        // Load Content Writer prompt from localStorage on page load
        if (contentWriterPromptInput) {
            const savedPrompt = localStorage.getItem('contentWriterPrompt');
            if (savedPrompt !== null) {
                contentWriterPromptInput.value = savedPrompt;
            }
            
            // Save Content Writer prompt to localStorage when it changes
            let saveContentWriterPromptTimeout;
            contentWriterPromptInput.addEventListener('input', function() {
                clearTimeout(saveContentWriterPromptTimeout);
                saveContentWriterPromptTimeout = setTimeout(() => {
                    localStorage.setItem('contentWriterPrompt', contentWriterPromptInput.value);
                }, 500); // Save 500ms after last change
            });
        }
        
        // Auto-save config when values change
        let saveConfigTimeout;
        function saveConfig() {
            clearTimeout(saveConfigTimeout);
            saveConfigTimeout = setTimeout(async () => {
                try {
                    const config = {
                        prompt: promptInput.value,
                        voice1: voice1Input.value,
                        voice2: voice2Input.value
                    };
                    await fetch('/save-config', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify(config)
                    });
                } catch (error) {
                    console.error('Error saving config:', error);
                }
            }, 1000); // Wait 1 second after last change before saving
        }
        
        // Add event listeners for auto-save
        promptInput.addEventListener('input', saveConfig);
        voice1Input.addEventListener('input', saveConfig);
        voice2Input.addEventListener('input', saveConfig);

        // Test API button handler
        const testApiButton = document.getElementById('testApiButton');
        const testApiResult = document.getElementById('testApiResult');
        
        testApiButton.addEventListener('click', async function() {
            testApiButton.disabled = true;
            testApiButton.textContent = 'Testing...';
            testApiResult.className = 'test-api-result show info';
            testApiResult.textContent = 'Testing API connection...';
            
            try {
                const response = await fetch('/test-api', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'}
                });
                
                const result = await response.json();
                
                if (result.success) {
                    testApiResult.className = 'test-api-result show success';
                    testApiResult.textContent = `✓ ${result.message} (Audio size: ${result.audio_size} bytes, Extension: ${result.file_extension})`;
                } else {
                    testApiResult.className = 'test-api-result show error';
                    testApiResult.textContent = `✗ ${result.message}`;
                }
            } catch (error) {
                testApiResult.className = 'test-api-result show error';
                testApiResult.textContent = `✗ Error: ${error.message}`;
            } finally {
                testApiButton.disabled = false;
                testApiButton.textContent = '🔍 Test API';
            }
        });

        // Handle file selection
        fileInput.addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (file) {
                fileNameDisplay.textContent = file.name;
                
                // Send file to backend to decode with proper encoding support (GBK, UTF-8, etc.)
                const formData = new FormData();
                formData.append('text_file', file);
                
                try {
                    showStatus('Decoding file content...', 'info');
                    const response = await fetch('/decode-file', {
                        method: 'POST',
                        body: formData
                    });
                    
                    if (response.ok) {
                        const result = await response.json();
                        
                        // Display chapters if available
                        if (result.chapters && result.chapters.length > 0) {
                            displayChapters(result.chapters);
                            showStatus(`File loaded successfully! Found ${result.chapters.length} chapter(s).`, 'success');
                        } else {
                            hideChapters();
                            showStatus('File loaded successfully!', 'success');
                        }
                    } else {
                        const error = await response.json();
                        showStatus('Error decoding file: ' + (error.error || 'Unknown error'), 'error');
                    }
                } catch (error) {
                    showStatus('Error reading file. File will still be processed correctly.', 'info');
                }
            } else {
                fileNameDisplay.textContent = 'No file chosen';
                hideChapters();
            }
        });

        // Handle Content Writer file selection
        contentWriterFileInput.addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (file) {
                contentWriterFileNameDisplay.textContent = file.name;
                
                // Send file to backend to decode with proper encoding support (GBK, UTF-8, etc.)
                const formData = new FormData();
                formData.append('text_file', file);
                
                try {
                    const response = await fetch('/decode-file', {
                        method: 'POST',
                        body: formData
                    });
                    
                    if (response.ok) {
                        const result = await response.json();
                        
                        // Display chapters if available
                        if (result.chapters && result.chapters.length > 0) {
                            displayContentWriterChapters(result.chapters);
                        } else {
                            hideContentWriterChapters();
                        }
                    } else {
                        const error = await response.json();
                        console.error('Error decoding file:', error.error || 'Unknown error');
                    }
                } catch (error) {
                    console.error('Error reading file:', error);
                }
            } else {
                contentWriterFileNameDisplay.textContent = 'No file chosen';
                hideContentWriterChapters();
            }
        });

        // Handle Content Writer Prompt file selection
        contentWriterPromptFileInput.addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (file) {
                contentWriterPromptFileNameDisplay.textContent = file.name;
                
                // Send file to backend to decode
                const formData = new FormData();
                formData.append('text_file', file);
                
                try {
                    const response = await fetch('/decode-file', {
                        method: 'POST',
                        body: formData
                    });
                    
                    if (response.ok) {
                        const result = await response.json();
                        // Display file content in prompt textarea
                        contentWriterPromptInput.value = result.content || '';
                    } else {
                        const error = await response.json();
                        console.error('Error decoding prompt file:', error.error || 'Unknown error');
                    }
                } catch (error) {
                    console.error('Error reading prompt file:', error);
                }
            } else {
                contentWriterPromptFileNameDisplay.textContent = 'No file chosen';
            }
        });

        // Handle Content Writer Plot file selection
        contentWriterPlotFileInput.addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (file) {
                contentWriterPlotFileNameDisplay.textContent = file.name;
                
                // Send file to backend to decode
                const formData = new FormData();
                formData.append('text_file', file);
                
                try {
                    const response = await fetch('/decode-file', {
                        method: 'POST',
                        body: formData
                    });
                    
                    if (response.ok) {
                        const result = await response.json();
                        // Display file content in plot text window
                        contentWriterPlotText.value = result.content || '';
                    } else {
                        const error = await response.json();
                        console.error('Error decoding plot file:', error.error || 'Unknown error');
                    }
                } catch (error) {
                    console.error('Error reading plot file:', error);
                }
            } else {
                contentWriterPlotFileNameDisplay.textContent = 'No file chosen';
            }
        });

        // Handle Generate Next Chapter button
        generateNextChapterButton.addEventListener('click', async function() {
            // This is a placeholder - you can implement the actual generation logic here
            generateNextChapterButton.disabled = true;
            generateNextChapterButton.textContent = 'Generating...';
            
            try {
                // Get the current content
                const donePart = contentWriterChapterRead.value || '';
                const prompt = contentWriterPromptInput.value || '';
                const plot = contentWriterPlotText.value || '';
                
                // TODO: Implement actual generation logic
                // For now, just show a placeholder message
                contentWriterNextChapter.value = 'Next chapter generation will appear here...\n\nDone Part:\n' + donePart.substring(0, 200) + '...\n\nPrompt:\n' + prompt.substring(0, 200) + '...\n\nPlot:\n' + plot.substring(0, 200) + '...';
                
                // Simulate generation delay
                await new Promise(resolve => setTimeout(resolve, 1000));
            } catch (error) {
                console.error('Error generating next chapter:', error);
                contentWriterNextChapter.value = 'Error: ' + error.message;
            } finally {
                generateNextChapterButton.disabled = false;
                generateNextChapterButton.textContent = 'Generate Next Chapter';
            }
        });

        // Handle Save All Chapters button
        saveAllChaptersButton.addEventListener('click', async function() {
            saveAllChaptersButton.disabled = true;
            saveAllChaptersButton.textContent = 'Saving...';
            
            try {
                // Collect all chapters data
                const chapters = window.contentWriterChaptersData || [];
                const nextChapter = contentWriterNextChapter.value || '';
                
                // Create a blob with all chapters content
                let allChaptersText = '';
                
                // Add existing chapters
                if (chapters && chapters.length > 0) {
                    chapters.forEach((chapter, index) => {
                        allChaptersText += `${chapter.title}\n\n${chapter.content}\n\n`;
                    });
                }
                
                // Add the next chapter if it exists
                if (nextChapter.trim()) {
                    allChaptersText += `\n\n--- Next Chapter ---\n\n${nextChapter}`;
                }
                
                // Create a download link
                const blob = new Blob([allChaptersText], { type: 'text/plain;charset=utf-8' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `all_chapters_${new Date().getTime()}.txt`;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);
                
                saveAllChaptersButton.textContent = 'Saved!';
                setTimeout(() => {
                    saveAllChaptersButton.textContent = 'Save All Chapters';
                }, 2000);
            } catch (error) {
                console.error('Error saving chapters:', error);
                saveAllChaptersButton.textContent = 'Error saving';
                setTimeout(() => {
                    saveAllChaptersButton.textContent = 'Save All Chapters';
                }, 2000);
            } finally {
                saveAllChaptersButton.disabled = false;
            }
        });

        // Handle form submission
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData(form);
            
            // Show loading state
            generateButton.disabled = true;
            generateButton.textContent = 'Generating...';
            showStatus('Generating audio, please wait...', 'info');
            
            try {
                const response = await fetch('/generate', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    // Get the audio file
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'tts_output.wav';
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(url);
                    document.body.removeChild(a);
                    
                    showStatus('Audio generated successfully! Download started.', 'success');
                } else {
                    const error = await response.json();
                    showStatus('Error: ' + (error.error || 'Failed to generate audio'), 'error');
                }
            } catch (error) {
                showStatus('Error: ' + error.message, 'error');
            } finally {
                generateButton.disabled = false;
                generateButton.textContent = 'Generate Audio';
            }
        });

        function showStatus(message, type) {
            statusMessage.textContent = message;
            statusMessage.className = 'status-message ' + type;
            setTimeout(() => {
                statusMessage.className = 'status-message';
            }, 5000);
        }

        // Check pydub availability for volume normalization
        let pydubAvailable = null; // null means not checked yet
        async function checkPydubAvailability() {
            try {
                const response = await fetch('/check-pydub');
                const data = await response.json();
                pydubAvailable = data.available || false;
                console.log(`pydub available: ${pydubAvailable} (normalization: ${pydubAvailable ? 'enabled' : 'disabled'})`);
                return pydubAvailable;
            } catch (error) {
                console.error('Error checking pydub availability:', error);
                pydubAvailable = false;
                return false;
            }
        }

        // Check pydub availability on page load
        checkPydubAvailability();

        async function displayChapters(chapters) {
            const ttsChaptersListGroup = document.getElementById('ttsChaptersListGroup');
            const ttsChaptersList = document.getElementById('ttsChaptersList');
            const ttsChapterContentGroup = document.getElementById('ttsChapterContentGroup');
            const ttsChapterContentArea = document.getElementById('ttsChapterContentArea');
            const chaptersHeader = document.getElementById('chaptersHeader');
            const generateAllBtn = document.getElementById('generateAllChaptersButton');
            
            // Check pydub availability if not already checked
            if (pydubAvailable === null) {
                await checkPydubAvailability();
            }
            
            // Show chapter list group
            ttsChaptersListGroup.style.display = 'block';
            
            // Clear existing chapter buttons
            ttsChaptersList.innerHTML = '';
            
            // Store chapters globally for generation
            window.chaptersData = chapters;
            
            // Store audio file checks globally
            window.ttsAudioFileChecks = {};
            
            // Check for existing audio files for each chapter (both paragraph files and full chapter files)
            const audioFileChecks = await Promise.all(
                chapters.map(async (chapter, idx) => {
                    const result = {
                        paragraphFiles: {},
                        chapterGenerated: false,
                        chapterFilename: null
                    };
                    
                    // Check paragraph audio files
                    if (chapter.paragraphs && chapter.paragraphs.length > 0) {
                        try {
                            const response = await fetch('/check-audio-files', {
                                method: 'POST',
                                headers: {'Content-Type': 'application/json'},
                                body: JSON.stringify({
                                    chapter_title: chapter.title,
                                    total_paragraphs: chapter.paragraphs.length
                                })
                            });
                            
                            if (response.ok) {
                                const checkResult = await response.json();
                                result.paragraphFiles = checkResult.existing_files || {};
                            }
                        } catch (error) {
                            console.error(`Error checking paragraph audio for chapter ${idx}:`, error);
                        }
                    }
                    
                    // Check if full chapter audio file exists
                    try {
                        const chapterResponse = await fetch('/check-chapter-generated', {
                            method: 'POST',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({
                                chapter_title: chapter.title
                            })
                        });
                        
                        if (chapterResponse.ok) {
                            const chapterResult = await chapterResponse.json();
                            result.chapterGenerated = chapterResult.generated || false;
                            result.chapterFilename = chapterResult.filename || null;
                        }
                    } catch (error) {
                        console.error(`Error checking chapter audio for chapter ${idx}:`, error);
                    }
                    
                    return result;
                })
            );
            
            // Store audio checks globally
            audioFileChecks.forEach((check, idx) => {
                window.ttsAudioFileChecks[idx] = check;
            });
            
            // Update Generate All Chapters button
            if (generateAllBtn) {
                generateAllBtn.style.display = 'inline-block';
                generateAllBtn.onclick = async function() {
                    await generateAllChapters(chapters);
                };
            }
            
            // Create clickable chapter name buttons
            chapters.forEach((chapter, index) => {
                const chapterButton = document.createElement('button');
                chapterButton.type = 'button';
                chapterButton.style.cssText = 'padding: 8px 16px; margin: 4px; border: 2px solid #e0e0e0; border-radius: 6px; cursor: pointer; background: white; color: #333; font-size: 14px; font-weight: 500; transition: all 0.2s; white-space: nowrap;';
                chapterButton.className = 'tts-chapter-item';
                chapterButton.setAttribute('data-chapter-index', index);
                chapterButton.textContent = chapter.title;
                
                // Hover effect
                chapterButton.addEventListener('mouseenter', function() {
                    if (!this.classList.contains('active')) {
                        this.style.background = '#f0f0f0';
                        this.style.borderColor = '#667eea';
                    }
                });
                chapterButton.addEventListener('mouseleave', function() {
                    if (!this.classList.contains('active')) {
                        this.style.background = 'white';
                        this.style.borderColor = '#e0e0e0';
                    }
                });
                
                // Click handler to show chapter paragraphs
                chapterButton.addEventListener('click', function() {
                    // Remove active class from all items
                    document.querySelectorAll('.tts-chapter-item').forEach(item => {
                        item.classList.remove('active');
                        item.style.background = 'white';
                        item.style.borderColor = '#e0e0e0';
                        item.style.color = '#333';
                    });
                    
                    // Add active class to clicked item
                    this.classList.add('active');
                    this.style.background = '#667eea';
                    this.style.borderColor = '#667eea';
                    this.style.color = 'white';
                    
                    // Show chapter paragraphs in the single content area
                    showTTSChapter(index, chapter, audioFileChecks[index]);
                });
                
                ttsChaptersList.appendChild(chapterButton);
            });
            
            // Show first chapter by default
            if (chapters.length > 0) {
                const firstChapter = ttsChaptersList.querySelector('[data-chapter-index="0"]');
                if (firstChapter) {
                    firstChapter.click();
                }
            }
        }
        
        function showTTSChapter(chapterIndex, chapter, audioCheck) {
            const ttsChapterContentGroup = document.getElementById('ttsChapterContentGroup');
            const ttsChapterContentArea = document.getElementById('ttsChapterContentArea');
            const ttsChapterContentLabel = document.getElementById('ttsChapterContentLabel');
            const existingFiles = audioCheck ? (audioCheck.paragraphFiles || {}) : {};
            
            // Show content area
            ttsChapterContentGroup.style.display = 'block';
            ttsChapterContentLabel.textContent = `${chapter.title} - Paragraphs`;
            
            // Clear existing content
            ttsChapterContentArea.innerHTML = '';
            
            // Create chapter action buttons container
            const chapterActionsDiv = document.createElement('div');
            chapterActionsDiv.style.cssText = 'margin-bottom: 20px; padding: 15px; background: #f9f9f9; border-radius: 8px; border: 1px solid #e0e0e0;';
            
            const chapterActions = document.createElement('div');
            chapterActions.className = 'chapter-actions';
            chapterActions.style.cssText = 'display: flex; gap: 10px; flex-wrap: wrap;';
            
            // Create Generate Chapter button
            const generateChapterBtn = document.createElement('button');
            generateChapterBtn.className = 'generate-chapter-button';
            generateChapterBtn.type = 'button';
            generateChapterBtn.textContent = 'Generate Chapter';
            generateChapterBtn.setAttribute('data-chapter-index', chapterIndex);
            generateChapterBtn.setAttribute('data-button-type', 'chapter');
            generateChapterBtn.addEventListener('click', async function(e) {
                e.stopPropagation();
                await generateChapter(chapterIndex, chapter);
            });
            
            // Create Generate Paragraphs button
            const generateParagraphsBtn = document.createElement('button');
            generateParagraphsBtn.className = 'generate-paragraphs-button';
            generateParagraphsBtn.type = 'button';
            generateParagraphsBtn.textContent = 'Generate Paragraphs';
            generateParagraphsBtn.setAttribute('data-chapter-index', chapterIndex);
            generateParagraphsBtn.setAttribute('data-button-type', 'paragraphs');
            
            // Create progress container
            const progressContainer = document.createElement('div');
            progressContainer.className = 'progress-container';
            progressContainer.setAttribute('data-chapter-index', chapterIndex);
            const progressBar = document.createElement('div');
            progressBar.className = 'progress-bar';
            const progressFill = document.createElement('div');
            progressFill.className = 'progress-fill';
            const progressText = document.createElement('div');
            progressText.className = 'progress-text';
            progressText.textContent = 'Ready';
            progressBar.appendChild(progressFill);
            progressContainer.appendChild(progressBar);
            progressContainer.appendChild(progressText);
            
            generateParagraphsBtn.addEventListener('click', async function(e) {
                e.stopPropagation();
                await generateParagraphs(chapterIndex, chapter, progressContainer, progressFill, progressText, playAudioBtn);
            });
            
            // Create Play Audio button
            const playAudioBtn = document.createElement('button');
            playAudioBtn.className = 'play-audio-button';
            playAudioBtn.type = 'button';
            playAudioBtn.textContent = '▶ Play Audio';
            playAudioBtn.setAttribute('data-chapter-index', chapterIndex);
            
            // If chapter audio already exists, show the play button
            if (audioCheck && audioCheck.chapterGenerated && audioCheck.chapterFilename) {
                playAudioBtn.classList.add('show');
                playAudioBtn.setAttribute('data-audio-files', JSON.stringify([audioCheck.chapterFilename]));
                playAudioBtn.setAttribute('data-chapter-title', chapter.title);
            }
            
            playAudioBtn.addEventListener('click', async function(e) {
                e.stopPropagation();
                await playChapterAudio(chapterIndex, chapter);

        async function generateChapter(chapterIndex, chapter) {
            const button = document.querySelector(`button[data-chapter-index="${chapterIndex}"][data-button-type="chapter"]`);
            const progressContainer = document.querySelector(`.progress-container[data-chapter-index="${chapterIndex}"]`);
            const progressFill = progressContainer.querySelector('.progress-fill');
            const progressText = progressContainer.querySelector('.progress-text');
            const originalText = button.textContent;
            
            try {
                button.disabled = true;
                button.textContent = 'Generating...';
                progressContainer.classList.add('show');
                progressFill.style.width = '0%';
                progressText.textContent = 'Preparing...';
                showStatus(`Generating audio for ${chapter.title}...`, 'info');
                
                // Get prompt and voices from form
                let prompt = document.getElementById('prompt').value;
                // Add default prompt text if not already present
                const defaultPrompt = 'Please read carefully and don\'t mis-read any word.';
                if (!prompt.includes(defaultPrompt)) {
                    prompt = prompt ? `${prompt} ${defaultPrompt}` : defaultPrompt;
                }
                const voice1 = document.getElementById('voice1').value || 'Puck';
                const voice2 = document.getElementById('voice2').value || 'Zephyr';
                
                // Combine all paragraphs for the chapter, starting with the chapter title
                let chapterContent;
                if (chapter.paragraphs && chapter.paragraphs.length > 0) {
                    // Start with chapter title, then add all paragraphs
                    chapterContent = chapter.title + '\n\n' + chapter.paragraphs.join('\n\n');
                    console.log(`Generating chapter "${chapter.title}":`, {
                        totalParagraphs: chapter.paragraphs.length,
                        contentLength: chapterContent.length,
                        firstChars: chapterContent.substring(0, 200)
                    });
                } else {
                    chapterContent = chapter.title + '\n\n' + chapter.content;
                    console.log(`Generating chapter "${chapter.title}" (no paragraphs array):`, {
                        contentLength: chapterContent.length,
                        firstChars: chapterContent.substring(0, 200)
                    });
                }
                
                progressFill.style.width = '30%';
                progressText.textContent = 'Sending request...';
                
                const formData = new FormData();
                formData.append('text_content', chapterContent);
                formData.append('prompt', prompt);
                formData.append('voice1', voice1);
                formData.append('voice2', voice2);
                formData.append('chapter_title', chapter.title);
                formData.append('save_to_file', 'true');
                
                progressFill.style.width = '50%';
                progressText.textContent = 'Generating audio...';
                
                const response = await fetch('/generate', {
                    method: 'POST',
                    body: formData
                });
                
                progressFill.style.width = '80%';
                progressText.textContent = 'Processing...';
                
                if (response.ok) {
                    const result = await response.json();
                    console.log('Generation result:', result);
                    progressFill.style.width = '100%';
                    progressText.textContent = 'Complete!';
                    showStatus(result.message || `Audio saved for ${chapter.title}!`, 'success');
                    playTing();
                    
                    // Show play button for chapter generation
                    const playAudioBtn = document.querySelector(`button.play-audio-button[data-chapter-index="${chapterIndex}"]`);
                    if (playAudioBtn && result.filename) {
                        playAudioBtn.classList.add('show');
                        playAudioBtn.setAttribute('data-audio-files', JSON.stringify([result.filename]));
                        playAudioBtn.setAttribute('data-chapter-title', chapter.title);
                    }
                    
                    // Hide progress after a delay
                    setTimeout(() => {
                        progressContainer.classList.remove('show');
                    }, 2000);
                } else {
                    const errorText = await response.text();
                    console.error('Error response:', errorText);
                    let error;
                    try {
                        error = JSON.parse(errorText);
                    } catch (e) {
                        error = { error: errorText };
                    }
                    showStatus('Error: ' + (error.error || 'Failed to generate audio'), 'error');
                    progressContainer.classList.remove('show');
                }
            } catch (error) {
                console.error('Exception in generateChapter:', error);
                showStatus('Error: ' + error.message, 'error');
                progressContainer.classList.remove('show');
            } finally {
                button.disabled = false;
                button.textContent = originalText;
            }
        }

        async function generateParagraphs(chapterIndex, chapter, progressContainer, progressFill, progressText, playAudioBtn) {
            const button = document.querySelector(`button[data-chapter-index="${chapterIndex}"][data-button-type="paragraphs"]`);
            const originalText = button.textContent;
            
            try {
                button.disabled = true;
                button.textContent = 'Generating...';
                progressContainer.classList.add('show');
                progressFill.style.width = '0%';
                progressText.textContent = 'Starting...';
                showStatus(`Generating paragraphs for ${chapter.title}...`, 'info');
                
                // Get prompt and voices from form
                let prompt = document.getElementById('prompt').value;
                // Add default prompt text if not already present
                const defaultPrompt = 'Please read carefully and don\'t mis-read any word.';
                if (!prompt.includes(defaultPrompt)) {
                    prompt = prompt ? `${prompt} ${defaultPrompt}` : defaultPrompt;
                }
                const voice1 = document.getElementById('voice1').value || 'Puck';
                const voice2 = document.getElementById('voice2').value || 'Zephyr';
                
                // Get paragraphs
                const paragraphs = chapter.paragraphs || [chapter.content];
                const totalParagraphs = paragraphs.length;
                
                console.log(`Generating paragraphs for chapter "${chapter.title}":`, {
                    totalParagraphs: totalParagraphs,
                    paragraphs: paragraphs,
                    paragraphCount: paragraphs.length
                });
                
                const formData = new FormData();
                paragraphs.forEach((para, idx) => {
                    console.log(`Adding paragraph ${idx + 1}:`, para.substring(0, 50) + '...');
                    formData.append('paragraphs', para);
                });
                formData.append('chapter_title', chapter.title);
                formData.append('prompt', prompt);
                formData.append('voice1', voice1);
                formData.append('voice2', voice2);
                
                // Update progress during generation
                const updateProgress = (current, total) => {
                    const percent = Math.round((current / total) * 100);
                    progressFill.style.width = `${percent}%`;
                    progressText.textContent = `Generating paragraph ${current} of ${total}`;
                };
                
                // Animate progress while waiting for response
                updateProgress(0, totalParagraphs);
                let simulatedProgress = 0;
                const progressInterval = setInterval(() => {
                    simulatedProgress += 1;
                    const percent = Math.min(simulatedProgress, 90);
                    progressFill.style.width = `${percent}%`;
                    progressText.textContent = `Generating... ${Math.round(percent)}%`;
                }, 200); // Update every 200ms
                
                const response = await fetch('/generate-paragraphs', {
                    method: 'POST',
                    body: formData
                });
                
                // Clear interval when response arrives
                clearInterval(progressInterval);
                
                if (response.ok) {
                    const result = await response.json();
                    progressFill.style.width = '100%';
                    progressText.textContent = `Complete! Generated ${result.files.length} file(s)`;
