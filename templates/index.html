                    }
                    
                    // Hide progress after a delay
                    setTimeout(() => {
                        progressContainer.classList.remove('show');
                    }, 3000);
                } else {
                    const error = await response.json();
                    showStatus('Error: ' + (error.error || 'Failed to generate paragraphs'), 'error');
                    progressContainer.classList.remove('show');
                }
            } catch (error) {
                showStatus('Error: ' + error.message, 'error');
                progressContainer.classList.remove('show');
            } finally {
                button.disabled = false;
                button.textContent = originalText;
            }
        }

        async function playChapterAudio(chapterIndex, chapter) {
            const playAudioBtn = document.querySelector(`button.play-audio-button[data-chapter-index="${chapterIndex}"]`);
            const audioFiles = playAudioBtn.getAttribute('data-audio-files');
            
            if (!audioFiles) {
                showStatus('No audio files available for this chapter', 'error');
                return;
            }
            
            const audioKey = `chapter_${chapterIndex}`;
            const currentAudioData = window.currentlyPlayingChapterAudio[audioKey];
            
            // If audio is playing, stop it
            if (currentAudioData && currentAudioData.audio && !currentAudioData.audio.paused) {
                currentAudioData.audio.pause();
                currentAudioData.audio.currentTime = 0;
                playAudioBtn.textContent = '▶ Play Audio';
                delete window.currentlyPlayingChapterAudio[audioKey];
                showStatus('Stopped', 'info');
                return;
            }
            
            try {
                const files = JSON.parse(audioFiles);
                const chapterTitle = playAudioBtn.getAttribute('data-chapter-title');
                
                // Create audio element
                let currentIndex = 0;
                const audio = new Audio();
                
                // Store audio reference for stopping
                window.currentlyPlayingChapterAudio[audioKey] = {
                    audio: audio,
                    currentIndex: currentIndex,
                    files: files
                };
                
                // Change button text to Pause
                playAudioBtn.textContent = '⏸ Pause';
                
                const playNext = () => {
                    if (currentIndex < files.length) {
                        const safeTitle = chapterTitle.replace(/[<>:"/\\|?*]/g, '_');
                        const filename = files[currentIndex];
                        audio.src = `/outputs/${filename}`;
                        audio.play();
                        showStatus(`Playing: ${filename}`, 'info');
                        
                        // Update stored index
                        if (window.currentlyPlayingChapterAudio[audioKey]) {
                            window.currentlyPlayingChapterAudio[audioKey].currentIndex = currentIndex;
                        }
                        
                        audio.onended = () => {
                            currentIndex++;
                            if (currentIndex < files.length) {
                                playNext();
                            } else {
                                playAudioBtn.textContent = '▶ Play Audio';
                                delete window.currentlyPlayingChapterAudio[audioKey];
                                showStatus('Finished playing all paragraphs', 'success');
                            }
                        };
                        
                        audio.onerror = (error) => {
                            playAudioBtn.textContent = '▶ Play Audio';
                            delete window.currentlyPlayingChapterAudio[audioKey];
                            showStatus('Error playing audio: ' + error.message, 'error');
                        };
                    }
                };
                
                playNext();
            } catch (error) {
                playAudioBtn.textContent = '▶ Play Audio';
                delete window.currentlyPlayingChapterAudio[audioKey];
                showStatus('Error playing audio: ' + error.message, 'error');
            }
        }

        // Store currently playing audio for each paragraph
        window.currentlyPlayingAudio = {};
        // Store currently playing audio for each chapter
        window.currentlyPlayingChapterAudio = {};
        // Store chapter paragraph playback state
        window.currentlyPlayingChapterParagraphs = {};
        
        // Play all paragraphs in a chapter sequentially
        async function playParagraphAudio(chapterIndex, paragraphIndex, filename, button) {
            const chapterKey = `chapter_${chapterIndex}`;
            const currentPlayback = window.currentlyPlayingChapterParagraphs[chapterKey];
            
            // If already playing, stop it
            if (currentPlayback && currentPlayback.audio && !currentPlayback.audio.paused) {
                currentPlayback.audio.pause();
                currentPlayback.audio.currentTime = 0;
                // Reset all paragraph buttons in this chapter
                const allParaButtons = document.querySelectorAll(`button.play-paragraph-button[data-chapter-index="${chapterIndex}"]`);
                allParaButtons.forEach(btn => {
                    btn.textContent = '▶ Play';
                });
                delete window.currentlyPlayingChapterParagraphs[chapterKey];
                showStatus('Stopped', 'info');
                return;
            }
            
            // Get chapter data
            const chapters = window.chaptersData;
            if (!chapters || !chapters[chapterIndex]) {
                showStatus('Chapter data not found', 'error');
                return;
            }
            
            const chapter = chapters[chapterIndex];
            const totalParagraphs = chapter.paragraphs ? chapter.paragraphs.length : 1;
            
            // Parse paragraphIndex to integer
            const startParagraphIndex = parseInt(paragraphIndex, 10);
            
            // Collect all paragraph buttons and their filenames starting from the clicked paragraph
            // (skip paragraphs without audio)
            const paragraphFiles = [];
            for (let i = startParagraphIndex; i < totalParagraphs; i++) {
                const paraBtn = document.querySelector(`button.play-paragraph-button[data-chapter-index="${chapterIndex}"][data-paragraph-index="${i}"]`);
                if (paraBtn) {
                    const paraFilename = paraBtn.getAttribute('data-filename');
                    if (paraFilename) {
                        paragraphFiles.push({
                            index: i,
                            filename: paraFilename,
                            button: paraBtn
                        });
                    }
                }
            }
            
            if (paragraphFiles.length === 0) {
                showStatus('No audio files available for any paragraph starting from this paragraph', 'error');
                return;
            }
            
            // Update all paragraph buttons that have audio files to show Pause
            paragraphFiles.forEach(fileInfo => {
                if (fileInfo.button) {
                    fileInfo.button.textContent = '⏸ Pause';
                }
            });
            
            // Start playing all paragraphs sequentially from the clicked paragraph
            let currentFileIndex = 0;
            const audio = new Audio();
            
            // Store playback state
            window.currentlyPlayingChapterParagraphs[chapterKey] = {
                audio: audio,
                currentFileIndex: currentFileIndex,
                paragraphFiles: paragraphFiles
            };
            
            const playNext = () => {
                if (currentFileIndex < paragraphFiles.length) {
                    const fileInfo = paragraphFiles[currentFileIndex];
                    audio.src = `/outputs/${fileInfo.filename}`;
                    
                    showStatus(`Playing paragraph ${fileInfo.index + 1} of ${totalParagraphs}...`, 'info');
                    
                    // Update stored index
                    if (window.currentlyPlayingChapterParagraphs[chapterKey]) {
                        window.currentlyPlayingChapterParagraphs[chapterKey].currentFileIndex = currentFileIndex;
                    }
                    
                    audio.onended = () => {
                        currentFileIndex++;
                        if (currentFileIndex < paragraphFiles.length) {
                            playNext();
                        } else {
                            // Finished playing all paragraphs
                            paragraphFiles.forEach(fileInfo => {
                                if (fileInfo.button) {
                                    fileInfo.button.textContent = '▶ Play';
                                }
                            });
                            delete window.currentlyPlayingChapterParagraphs[chapterKey];
                            showStatus(`Finished playing all ${paragraphFiles.length} paragraph(s)`, 'success');
                        }
                    };
                    
                    audio.onerror = (error) => {
                        // Skip to next file on error
                        console.error(`Error playing ${fileInfo.filename}:`, error);
                        currentFileIndex++;
                        if (currentFileIndex < paragraphFiles.length) {
                            playNext();
                        } else {
                            paragraphFiles.forEach(fileInfo => {
                                if (fileInfo.button) {
                                    fileInfo.button.textContent = '▶ Play';
                                }
                            });
                            delete window.currentlyPlayingChapterParagraphs[chapterKey];
                            showStatus('Finished playing available paragraphs', 'info');
                        }
                    };
                    
                    audio.play();
                }
            };
            
            playNext();
        }

        // Concatenate all paragraph audio files for a chapter
        async function concatenateChapterAudio(chapterIndex, chapter, progressContainer, progressFill, progressText, playAudioBtn) {
            const button = document.querySelector(`button[data-chapter-index="${chapterIndex}"][data-button-type="concatenate"]`);
            const originalText = button.textContent;
            
            try {
                button.disabled = true;
                button.textContent = 'Concatenating...';
                progressContainer.classList.add('show');
                progressFill.style.width = '0%';
                progressText.textContent = 'Starting...';
                showStatus(`Concatenating audio for ${chapter.title}...`, 'info');
                
                // Check which audio files exist for this chapter
                const response = await fetch('/check-audio-files', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        chapter_title: chapter.title,
                        total_paragraphs: chapter.paragraphs ? chapter.paragraphs.length : 0
                    })
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    showStatus('Error: ' + (error.error || 'Failed to check audio files'), 'error');
                    progressContainer.classList.remove('show');
                    return;
                }
                
                const result = await response.json();
                const existingFiles = result.existing_files || {};
                
                // Build ordered list of audio files
                const audioFiles = [];
                for (let i = 1; i <= chapter.paragraphs.length; i++) {
                    if (existingFiles[i]) {
                        audioFiles.push(existingFiles[i]);
                    }
                }
                
                if (audioFiles.length === 0) {
                    showStatus('No audio files found to concatenate. Please generate paragraphs first.', 'error');
                    progressContainer.classList.remove('show');
                    return;
                }
                
                progressFill.style.width = '30%';
                progressText.textContent = `Found ${audioFiles.length} audio file(s)...`;
                
                // Call concatenate endpoint
                const concatResponse = await fetch('/concatenate-audio', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        chapter_title: chapter.title,
                        audio_files: audioFiles,
                        pause_seconds: 1.5
                    })
                });
                
                progressFill.style.width = '70%';
                progressText.textContent = 'Processing...';
                
                if (concatResponse.ok) {
                    const concatResult = await concatResponse.json();
                    console.log('Concatenation result:', concatResult);
                    progressFill.style.width = '100%';
                    progressText.textContent = 'Complete!';
                    showStatus(concatResult.message, 'success');
                    playTing();
                    
                    // Update play audio button to play the concatenated file
                    playAudioBtn.classList.add('show');
                    playAudioBtn.setAttribute('data-audio-files', JSON.stringify([concatResult.filename]));
                    playAudioBtn.setAttribute('data-chapter-title', chapter.title);
                    
                    // Hide progress after a delay
                    setTimeout(() => {
                        progressContainer.classList.remove('show');
                    }, 3000);
                } else {
                    const error = await concatResponse.json();
                    showStatus('Error: ' + (error.error || 'Failed to concatenate audio'), 'error');
                    progressContainer.classList.remove('show');
                }
            } catch (error) {
                console.error('Exception in concatenateChapterAudio:', error);
                showStatus('Error: ' + error.message, 'error');
                progressContainer.classList.remove('show');
            } finally {
                button.disabled = false;
                button.textContent = originalText;
            }
        }

        // Generate a single paragraph
        async function generateParagraph(chapterIndex, paragraphIndex) {
            const generateBtn = document.querySelector(`button.generate-paragraph-button[data-chapter-index="${chapterIndex}"][data-paragraph-index="${paragraphIndex}"]`);
            const originalText = generateBtn.textContent;
            
            try {
                // Get chapter data
                const chapters = window.chaptersData;
                if (!chapters || !chapters[chapterIndex] || !chapters[chapterIndex].paragraphs) {
                    showStatus('Unable to find paragraph data', 'error');
                    return;
                }
                
                const chapter = chapters[chapterIndex];
                const paragraph = chapter.paragraphs[paragraphIndex];
                
                if (!paragraph) {
                    showStatus('Paragraph not found', 'error');
                    return;
                }
                
                generateBtn.disabled = true;
                generateBtn.textContent = 'Generating...';
                
                // Get base prompt and voices from form
                let prompt = document.getElementById('prompt').value;
                const defaultPrompt = 'Please read carefully and don\'t mis-read any word.';
                if (!prompt.includes(defaultPrompt)) {
                    prompt = prompt ? `${prompt} ${defaultPrompt}` : defaultPrompt;
                }
                
                // Get paragraph-specific prompt if provided
                const paraPromptInput = document.querySelector(`input.paragraph-prompt[data-chapter-index="${chapterIndex}"][data-paragraph-index="${paragraphIndex}"]`);
                if (paraPromptInput && paraPromptInput.value.trim()) {
                    prompt = `${prompt} ${paraPromptInput.value.trim()}`;
                }
                
                const voice1 = document.getElementById('voice1').value || 'Puck';
                const voice2 = document.getElementById('voice2').value || 'Zephyr';
                
                showStatus(`Generating paragraph ${parseInt(paragraphIndex) + 1}...`, 'info');
                
                // Send generation request
                const formData = new FormData();
                formData.append('text_content', paragraph);
                formData.append('prompt', prompt);
                formData.append('voice1', voice1);
                formData.append('voice2', voice2);
                formData.append('chapter_title', chapter.title);
                formData.append('save_to_file', 'true');
                formData.append('paragraph_index', paragraphIndex);
                
                const response = await fetch('/generate', {
                    method: 'POST',
                    body: formData
                });
                
                if (response.ok) {
                    const result = await response.json();
                    showStatus(`Paragraph ${parseInt(paragraphIndex) + 1} generated successfully!`, 'success');
                    playTing();
                    
                    // Show play button
                    const playParaBtn = document.querySelector(`button.play-paragraph-button[data-chapter-index="${chapterIndex}"][data-paragraph-index="${paragraphIndex}"]`);
                    
                    if (playParaBtn && result.filename) {
                        playParaBtn.classList.remove('hidden');
                        playParaBtn.setAttribute('data-filename', result.filename);
                    }
                } else {
                    const error = await response.json();
                    showStatus('Error: ' + (error.error || 'Failed to generate paragraph'), 'error');
                }
            } catch (error) {
                showStatus('Error: ' + error.message, 'error');
            } finally {
                generateBtn.disabled = false;
                generateBtn.textContent = originalText;
            }
        }

        // Generate all chapters that haven't been generated yet
        async function generateAllChapters(chapters) {
            const generateAllBtn = document.getElementById('generateAllChaptersButton');
            const originalText = generateAllBtn.textContent;
            
            try {
                generateAllBtn.disabled = true;
                generateAllBtn.textContent = 'Checking...';
                
                // Check which chapters have already been generated
                const chapterStatuses = await Promise.all(
                    chapters.map(async (chapter, index) => {
                        try {
                            const response = await fetch('/check-chapter-generated', {
                                method: 'POST',
                                headers: {'Content-Type': 'application/json'},
                                body: JSON.stringify({
                                    chapter_title: chapter.title
                                })
                            });
                            
                            if (response.ok) {
                                const result = await response.json();
                                return {
                                    index: index,
                                    chapter: chapter,
                                    generated: result.generated || false
                                };
                            }
                        } catch (error) {
                            console.error(`Error checking chapter ${index}:`, error);
                        }
                        return {
                            index: index,
                            chapter: chapter,
                            generated: false
                        };
                    })
                );
                
                // Filter out chapters that have already been generated
                const chaptersToGenerate = chapterStatuses.filter(status => !status.generated);
                
                if (chaptersToGenerate.length === 0) {
                    showStatus('All chapters have already been generated!', 'info');
                    generateAllBtn.disabled = false;
                    generateAllBtn.textContent = originalText;
                    return;
                }
                
                generateAllBtn.textContent = `Generating ${chaptersToGenerate.length} chapter(s)...`;
                showStatus(`Starting generation of ${chaptersToGenerate.length} chapter(s)...`, 'info');
                
                // Get prompt and voices from form
                let prompt = document.getElementById('prompt').value;
                const defaultPrompt = 'Please read carefully and don\'t mis-read any word.';
                if (!prompt.includes(defaultPrompt)) {
                    prompt = prompt ? `${prompt} ${defaultPrompt}` : defaultPrompt;
                }
                const voice1 = document.getElementById('voice1').value || 'Puck';
                const voice2 = document.getElementById('voice2').value || 'Zephyr';
                
                // Generate each chapter sequentially
                let successCount = 0;
                let failCount = 0;
                
                for (let i = 0; i < chaptersToGenerate.length; i++) {
                    const status = chaptersToGenerate[i];
                    const chapterIndex = status.index;
                    const chapter = status.chapter;
                    
                    // Update button text to show current chapter
                    generateAllBtn.textContent = `Generating ${i + 1}/${chaptersToGenerate.length}: ${chapter.title}`;
                    showStatus(`Generating chapter ${i + 1}/${chaptersToGenerate.length}: ${chapter.title}...`, 'info');
                    
                    try {
                        // Combine all paragraphs for the chapter, starting with the chapter title
                        let chapterContent;
                        if (chapter.paragraphs && chapter.paragraphs.length > 0) {
                            chapterContent = chapter.title + '\n\n' + chapter.paragraphs.join('\n\n');
                        } else {
                            chapterContent = chapter.title + '\n\n' + chapter.content;
                        }
                        
                        const formData = new FormData();
                        formData.append('text_content', chapterContent);
                        formData.append('prompt', prompt);
                        formData.append('voice1', voice1);
                        formData.append('voice2', voice2);
                        formData.append('chapter_title', chapter.title);
                        formData.append('save_to_file', 'true');
                        
                        const response = await fetch('/generate', {
                            method: 'POST',
                            body: formData
                        });
                        
                        if (response.ok) {
                            const result = await response.json();
                            successCount++;
                            console.log(`Chapter ${i + 1} generated: ${chapter.title}`);
                            
                            // Update play button for this chapter if it exists
                            const playAudioBtn = document.querySelector(`button.play-audio-button[data-chapter-index="${chapterIndex}"]`);
                            if (playAudioBtn && result.filename) {
                                playAudioBtn.classList.add('show');
                                playAudioBtn.setAttribute('data-audio-files', JSON.stringify([result.filename]));
                                playAudioBtn.setAttribute('data-chapter-title', chapter.title);
                            }
                        } else {
                            failCount++;
                            const error = await response.json();
                            console.error(`Failed to generate chapter ${i + 1}: ${error.error || 'Unknown error'}`);
                        }
                    } catch (error) {
                        failCount++;
                        console.error(`Error generating chapter ${i + 1}:`, error);
                    }
                }
                
                // Show completion message
                if (successCount > 0) {
                    showStatus(`Successfully generated ${successCount} chapter(s)${failCount > 0 ? `, ${failCount} failed` : ''}!`, 'success');
                    playTing();
                } else {
                    showStatus(`Failed to generate any chapters.`, 'error');
                }
                
            } catch (error) {
                console.error('Error in generateAllChapters:', error);
                showStatus('Error: ' + error.message, 'error');
            } finally {
                generateAllBtn.disabled = false;
                generateAllBtn.textContent = originalText;
            }
        }

        // Play a short "ting" sound on completion
        function playTing() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                const ctx = new AudioContext();
                const o = ctx.createOscillator();
                const g = ctx.createGain();
                o.type = 'sine';
                o.frequency.setValueAtTime(880, ctx.currentTime); // A5
                g.gain.setValueAtTime(0.0001, ctx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.2, ctx.currentTime + 0.01);
                g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.3);
                o.connect(g);
                g.connect(ctx.destination);
                o.start();
                o.stop(ctx.currentTime + 0.32);
                // Close context after sound to free resources
                o.onended = () => {
                    try { ctx.close(); } catch (e) {}
                };
            } catch (e) {
                console.error('Unable to play completion sound:', e);
            }
        }
    </script>
